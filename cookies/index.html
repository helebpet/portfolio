<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Cookies</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <link rel="icon" type="image/png" href="favicon.png">
    <style>
      /* This piece relies on a mouse (cursor-avoidance, hover, webcam framing),
         so it is desktop-only. On phones/touch, show a notice instead. */
      #desktop-only {
        display: none;
      }
      @media (max-width: 900px), (pointer: coarse) {
        #background-site,
        #p5-container {
          display: none !important;
        }
        #desktop-only {
          display: flex;
          position: fixed;
          inset: 0;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          text-align: center;
          padding: 32px;
          background: #cc0000;
          color: #fff;
          font-family: 'Azeret Mono', monospace;
        }
        #desktop-only h1 {
          font-size: 22px;
          font-weight: 700;
          margin: 0;
          letter-spacing: 0.02em;
        }
        #desktop-only p {
          font-size: 13px;
          line-height: 1.5;
          max-width: 22em;
          margin: 0;
          opacity: 0.92;
        }
      }
    
    /* ---------------------------------------------------------------------
       Rag control: no widows, no orphans. `balance` evens short display text
       so headings never drop a lone word; `pretty` protects the tail of body
       copy. The inline script below hard-binds the last two words for
       browsers without support.
    --------------------------------------------------------------------- */
    h1, h2, h3, h4, h5, h6,
    .headline, .lead, .blurb, .eyebrow, figcaption, blockquote {
      text-wrap: balance;
    }

    p, li, dd {
      text-wrap: pretty;
    }

    p, li, h1, h2, h3, h4, h5, h6 {
      hyphens: none;
      -webkit-hyphens: none;
    }
  </style>
  </head>
  <body>
    <!-- Background website -->
    <iframe id="background-site" src="https://petrahelebrantova.com"></iframe>

    <main id="p5-container">
    </main>

    <!-- Desktop-only notice (shown on phones / touch devices) -->
    <div id="desktop-only">
      <h1>Best on desktop</h1>
      <p>This piece needs a mouse and a webcam, so it only runs on a computer. Open it on a desktop to experience it.</p>
    </div>

    <script>
      // Skip loading the p5 sketch entirely on touch / small screens.
      (function () {
        var isDesktop = window.matchMedia('(min-width: 901px)').matches
          && !window.matchMedia('(pointer: coarse)').matches;
        if (isDesktop) {
          var s = document.createElement('script');
          s.src = 'sketch.js';
          document.body.appendChild(s);
        }
      })();
    </script>
  
  <script>
  /* Bind the last two words of each block with a non-breaking space so no line
     is left carrying a single word. Mirrors typography.js on the main site. */
  (function () {
    var SELECTOR = 'h1, h2, h3, h4, h5, h6, p, li, figcaption, blockquote';
    var MAX_PAIR_LENGTH = 18;

    function lastTextNode(el) {
      for (var i = el.childNodes.length - 1; i >= 0; i--) {
        var node = el.childNodes[i];
        if (node.nodeType === 3 && node.nodeValue.trim() !== '') return node;
        if (node.nodeType === 1) {
          var nested = lastTextNode(node);
          if (nested) return nested;
        }
      }
      return null;
    }

    function run() {
      var blocks = document.querySelectorAll(SELECTOR);
      for (var i = 0; i < blocks.length; i++) {
        var el = blocks[i];
        if (el.querySelector('br')) continue;
        var node = lastTextNode(el);
        if (!node) continue;
        var text = node.nodeValue;
        var trimmed = text.replace(/\s+$/, '');
        var words = trimmed.split(/\s+/);
        if (words.length < 3) continue;
        if ((words[words.length - 2] + words[words.length - 1]).length > MAX_PAIR_LENGTH) continue;
        node.nodeValue = trimmed.replace(/\s+(\S+)$/, '\u00A0$1') + text.slice(trimmed.length);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }
  })();
  </script>
</body>
</html>
